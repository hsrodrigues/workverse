name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx tsc -p packages/shared/tsconfig.json --noEmit
      - run: npx tsc -p apps/server/tsconfig.json --noEmit
      - run: npx tsc -p apps/client/tsconfig.json --noEmit
      - run: npm test
      - run: npm run build
